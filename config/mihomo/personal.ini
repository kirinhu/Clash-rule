[custom]

;==================================================
; Mihomo 动态规则集 (Rule Providers) 定义
; 规则源：混合 MetaCubeX + QuixoticHeart
; - MetaCubeX 主力（覆盖广/维护勤）：主域名用其 .mrs
; - QuixoticHeart 补充（细分类更丰富）：apns/cdn/dmca/ecommerce/forum 等
; 所有 .mrs 均已验证 200 可达
;==================================================

;==================================================
; 去广告 & DNS 安全
;==================================================
ruleset=🚫 广告拦截,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
ruleset=REJECT,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
ruleset=REJECT,clash-domain:https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/domain/httpdns.mrs

