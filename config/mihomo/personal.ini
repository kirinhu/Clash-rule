;==================================================
; 自动测速筛选组
;==================================================
custom_proxy_group=🇺🇲 美国直连`url-test`(?=.*(美国|US|United States))^((?!(warp|WARP)).)*$`http://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国WARP`url-test`(?=.*(美国|US|United States))(?=.*(warp|WARP))`http://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港直连`url-test`(?=.*(香港|HK|Hong Kong|🇭🇰))^((?!(warp|WARP)).)*$`http://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港WARP`url-test`(?=.*(香港|HK|Hong Kong|🇭🇰))(?=.*(warp|WARP))`http://cp.cloudflare.com/generate_204`300,,50

