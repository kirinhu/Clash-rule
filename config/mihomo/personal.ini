[custom]

;==================================================
; Mihomo 动态规则集 (Rule Providers) 定义
; 规则源：QuixoticHeart 统一规则集
;
; ═══════════════════════════════════════════════════════
; 规则优先级：按策略组分类排序，不按公司分组
;
; 0️⃣ 广告拦截（最高优先）
; 1️⃣ 直连最低层（私有网络、国内服务、中国 IP 等）
; 2️⃣ 国内媒体
; 3️⃣ 细分专用代理策略组（YouTube → Netflix → Telegram 等）
; 4️⃣ 按服务商的大策略组（Google → Microsoft → Apple → AI → GitHub 等）
; 5️⃣ 兜底代理大集合（gfw → proxy → QH 补充）
; 6️⃣ 漏网之鱼
;
; 所有规则源统一使用 QuixoticHeart/rule-set 的 meta 分类 .mrs
; ═══════════════════════════════════════════════════════
;==================================================

;==================================================
; 0️⃣ 去广告 & DNS 安全（最高优先级）
;==================================================
ruleset=🚫 广告拦截,clash-domain:https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/domain/adrules.mrs
ruleset=🚫 广告拦截,clash-domain:https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/ipcidr/adrules.mrs
ruleset=REJECT,clash-domain:https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/domain/adrules.mrs
ruleset=REJECT,clash-domain:https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/domain/httpdns.mrs
ruleset=REJECT,clash-domain:https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/ipcidr/httpdns.mrs
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/ipcidr/private.mrs

;==================================================
